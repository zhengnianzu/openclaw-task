# OpenClaw Task 使用的 DeepSeek Harness JSON-RPC 组合。
# stdout 专供 SDK 协议，不能挂载终端 UI 或 stdout logger。

- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? ''
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED !== '0'
    toolBash: !!js "process.env.DSH_HARNESS_TOOLS_ENABLED === '0' ? false : {}"
    toolJobs: !!js "process.env.DSH_HARNESS_TOOLS_ENABLED === '0' ? false : {}"

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: llm-multi-provider
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js JSON.parse(process.env.DSH_LLM_PI_AI_PROVIDERS ?? '{}')

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

# ctx.web 能力槽：fetch/search provider 都要注册到它上面
- id: web
  name: '@deepseek-ai/dsh-web'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'

# 匿名公网 HTTP fetch provider，注册进 ctx.web
- id: web-fetch-http
  name: '@deepseek-ai/dsh-web-fetch-http'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'
  config:
    maxUrlLength: 2048
    maxResponseBytes: 5000000
    timeoutMs: 30000

# Exa 搜索 provider，注册进 ctx.web
# 优先读 EXA_API_KEY 环境变量；缺省时用配置里的字面量 key 兜底。
- id: web-search-exa
  name: '@deepseek-ai/dsh-web-search-exa'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'
  config:
    apiKey: !!js process.env.EXA_API_KEY ?? ''

# 模型直接调用的 web_search / web_fetch 工具
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'

# 浏览器能力:MCP Playwright server -> 工具名 mcp__browser__browser_navigate 等
- id: mcp-browser
  name: '@deepseek-ai/dsh-mcp-client'
  disabled: !!js process.env.DSH_HARNESS_TOOLS_ENABLED === '0'
  config:
    serverName: browser
    transport: stdio
    command: npx
    args: ['-y', '@playwright/mcp@latest']
    toolCallTimeoutMs: 120000